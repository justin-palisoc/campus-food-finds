<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Campus Food Finds</title>
</head>

<body>

  <header>
    <h1>Campus Food Finds</h1>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section>
      <h2>Contact Us</h2>

      <p>
        If you have questions or suggestions about our food recommendations,
        you can reach us through the following:
      </p>

      <ul>
        <li>Email: justinpalisoc318@gmail.com</li>
        <li>Facebook: Justin Palisoc</li>
      </ul>

      
      <form>
          <fieldset>
              <legend>Your details</legend>

              <label for="name">Name</label>
              <input type="text" id="name" name="name" required>

              <br><br>

              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>

              <br><br>

              <label for="subject">Subject</label>
              <select id="subject" name="subject">
                  <option value="food-question">Food recommendation question</option>
                  <option value="place-suggestion">Suggest a food place</option>
                  <option value="guide-feedback">Guide feedback</option>
                  <option value="other">Something else</option>
              </select>

              <br><br>

              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>

              <br><br>

              <button type="submit">Send message</button>

          </fieldset>
      </form>
    </section>

  </main>

  <footer>
    <p>© 2026 Campus Food Finds</p>
  </footer>

</body>

</html>
